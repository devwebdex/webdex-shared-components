# "services" fica por último: outras camadas do gerador (ex.: filas) acrescentam serviços no fim do arquivo.
volumes:
  mongodb-data:

services:
  mongodb:
    # 8.2, não 8: a 8.3 recusa iniciar em kernel 6.19 ou mais novo (SERVER-121912), como o do runner
    # do GitHub e de distribuições recentes. Voltar para `mongo:8` quando a 8.3 subir nesses kernels.
    image: mongo:8.2
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
    # Só localhost: a senha é de desenvolvimento e o Docker publica portas ignorando o firewall do host.
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
