name: Release

# Com changesets pendentes, abre ou atualiza o PR "Versionar pacotes". O merge desse PR (aprovado por alguém)
# dispara este workflow de novo, agora sem changesets, e aí os pacotes com versão nova são publicados.
on:
  push:
    branches: [prod]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Autenticar no GitHub Packages
        # Aspas simples: o pnpm expande ${NODE_AUTH_TOKEN} na hora de publicar; o token não vai para arquivo.
        run: |
          # shellcheck disable=SC2016
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: versionar pacotes'
          commit-message: 'chore: versionar pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
