name: CI

on:
  pull_request:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm agents:check

  windows:
    name: Windows (gerador e projeto gerado, sem docker nem e2e)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Gerar projeto (nest + prisma + postgres + next) com os pacotes deste checkout
        run: bun apps/create/src/cli.ts "${{ runner.temp }}/app" --yes --skip-git --link-packages . --backend nest --orm prisma --db postgres --queue none --frontend next
      - name: Build, tipos, lint e testes do projeto gerado
        working-directory: ${{ runner.temp }}/app
        run: pnpm build && pnpm check-types && pnpm lint && pnpm test

  templates:
    name: Projeto gerado (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nest + prisma + postgres + next + web3 (cookie)
            flags: --backend nest --orm prisma --db postgres --queue none --frontend next --web3 evm --session cookie
            database: true
          - name: nest + prisma + mysql
            flags: --backend nest --orm prisma --db mysql --queue none --frontend none --web3 none
            database: true
          - name: nest + drizzle + postgres + web3 (token)
            flags: --backend nest --orm drizzle --db postgres --queue none --frontend none --web3 evm --session token
            database: true
          - name: nest + drizzle + mysql
            flags: --backend nest --orm drizzle --db mysql --queue none --frontend none --web3 none
            database: true
          - name: nest + mongoose + mongodb + bullmq + web3 (cookie)
            flags: --backend nest --orm mongoose --db mongodb --queue bullmq --frontend none --web3 evm --session cookie
            database: true
          - name: express + prisma + postgres + bullmq
            flags: --backend express --orm prisma --db postgres --queue bullmq --frontend none --web3 none
            database: true
          - name: express + prisma + mysql + web3 (token)
            flags: --backend express --orm prisma --db mysql --queue none --frontend none --web3 evm --session token
            database: true
          - name: express + drizzle + postgres + next
            flags: --backend express --orm drizzle --db postgres --queue none --frontend next --web3 none
            database: true
          - name: express + drizzle + mysql + vite + web3 (cookie)
            flags: --backend express --orm drizzle --db mysql --queue none --frontend vite --web3 evm --session cookie
            database: true
          - name: express + mongoose + mongodb
            flags: --backend express --orm mongoose --db mongodb --queue none --frontend none --web3 none
            database: true
          - name: fastify + prisma + postgres + web3 (cookie)
            flags: --backend fastify --orm prisma --db postgres --queue none --frontend none --web3 evm --session cookie
            database: true
          - name: fastify + drizzle + mysql + vite
            flags: --backend fastify --orm drizzle --db mysql --queue none --frontend vite --web3 none
            database: true
          - name: fastify + mongoose + mongodb + bullmq + next + web3 (token)
            flags: --backend fastify --orm mongoose --db mongodb --queue bullmq --frontend next --web3 evm --session token
            database: true
          - name: adonis + postgres + inertia + web3 (cookie)
            flags: --backend adonis --orm lucid --db postgres --queue none --frontend inertia --web3 evm --session cookie
            database: true
          - name: adonis + mysql + bullmq + web3 (token)
            flags: --backend adonis --orm lucid --db mysql --queue bullmq --frontend none --web3 evm --session token
            database: true
          - name: só frontend (next)
            flags: --backend none --frontend next --web3 none
            database: false
          - name: só frontend (vite) + web3
            flags: --backend none --frontend vite --web3 evm
            database: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Gerar projeto com os pacotes deste checkout
        run: bun apps/create/src/cli.ts "$RUNNER_TEMP/app" --yes --skip-git --link-packages . ${{ matrix.flags }}
      - name: Build, tipos, lint e testes do projeto gerado
        working-directory: ${{ runner.temp }}/app
        run: pnpm build && pnpm check-types && pnpm lint && pnpm test
      - name: Banco, migrações e testes e2e (inclui GET /health)
        if: matrix.database
        working-directory: ${{ runner.temp }}/app
        run: |
          docker compose up -d --wait
          pnpm db:deploy
          pnpm test:e2e
